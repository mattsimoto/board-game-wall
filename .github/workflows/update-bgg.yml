name: Update BoardGameGeek data

on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * *'
  push:
    branches:
      - main
    paths:
      - 'scripts/fetch_bgg.py'
      - '.github/workflows/update-bgg.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Refresh current BGG Top 250
        env:
          BGG_TOKEN: ${{ secrets.BGG_TOKEN }}
          BGG_TOP_N: '250'
        run: python scripts/fetch_bgg.py

      - name: Commit changed data
        run: |
          git config user.name "board-game-wall-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/games.json data/rank-history.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update BoardGameGeek Top 250 data"
            git push
          fi
