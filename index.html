<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="A live visual wall of BoardGameGeek rankings, sized by popularity and rank movement." />
  <title>Board Game Wall</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="brand-block">
      <p class="eyebrow">LIVE BOARD GAME MARKET</p>
      <h1>Board Game Wall</h1>
      <p class="lede">The biggest games get the most space. Filter the wall to find what fits your table.</p>
    </div>
    <div class="header-utility">
      <div class="status-panel">
        <span class="live-dot" aria-hidden="true"></span>
        <span id="updatedLabel">Loading data…</span>
      </div>
      <a class="powered-bgg header-bgg" href="https://boardgamegeek.com/" target="_blank" rel="noopener noreferrer" aria-label="Powered by BoardGameGeek">
        <img src="https://gitlab.com/recommend.games/recommend-games-server/-/uploads/382aaa9dd1479c88dfdf18070300c35e/pic7779581.png" alt="Powered by BGG" />
      </a>
    </div>
  </header>

  <section class="controls" aria-label="Game filters">
    <div class="view-tabs" id="viewControls" aria-label="Wall view">
      <button class="active" data-view="rank">Overall</button>
      <button data-view="climbers">Climbers</button>
      <button data-view="fallers">Fallers</button>
      <button data-view="hot">Hot Now</button>
    </div>

    <div class="filter-strip">
      <label class="select-control">
        <span>Category</span>
        <select id="categoryFilter"><option value="all">All categories</option></select>
      </label>
      <label class="select-control">
        <span>Players</span>
        <select id="playersFilter">
          <option value="all">Any</option>
          <option value="1">1 player</option>
          <option value="2">2 players</option>
          <option value="3">3 players</option>
          <option value="4">4 players</option>
          <option value="5">5 players</option>
          <option value="6">6+ players</option>
        </select>
      </label>
      <label class="select-control">
        <span>Age</span>
        <select id="ageFilter">
          <option value="all">Any</option>
          <option value="6">6+</option>
          <option value="8">8+</option>
          <option value="10">10+</option>
          <option value="12">12+</option>
          <option value="14">14+</option>
        </select>
      </label>
      <label class="select-control">
        <span>Play time</span>
        <select id="timeFilter">
          <option value="all">Any</option>
          <option value="30">≤ 30 min</option>
          <option value="60">30–60 min</option>
          <option value="120">60–120 min</option>
          <option value="121">2+ hours</option>
        </select>
      </label>
      <button id="resetFilters" class="reset-button">Reset</button>
    </div>
  </section>

  <main>
    <section class="summary-bar">
      <div class="summary-count"><strong id="gameCount">0</strong><span>games</span></div>
      <div class="legend"><span class="move up">▲ rising</span><span class="move down">▼ falling</span><span class="move flat">• steady</span></div>
    </section>

    <section id="gameWall" class="game-wall" aria-live="polite"></section>
    <div id="emptyState" class="empty-state" hidden>No games match those filters.</div>
  </main>

  <dialog id="gameDialog" class="game-dialog">
    <button id="closeDialog" class="dialog-close" aria-label="Close">×</button>
    <div id="dialogContent"></div>
  </dialog>

  <footer>
    <div>
      <strong>Board Game Wall</strong>
      <span>BoardGameGeek is the source of game data and rankings.</span>
    </div>
    <a class="powered-bgg" href="https://boardgamegeek.com/" target="_blank" rel="noopener noreferrer" aria-label="Powered by BoardGameGeek">
      <img src="https://gitlab.com/recommend.games/recommend-games-server/-/uploads/382aaa9dd1479c88dfdf18070300c35e/pic7779581.png" alt="Powered by BGG" />
    </a>
  </footer>

  <script src="app.js" defer></script>
</body>
</html>
